name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to github.ref_name)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true

  homebrew:
    name: Update Homebrew Tap
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check Homebrew tap token
        id: check_token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN is not set; skipping automatic formula bump. Update robertguss/homebrew-tap Formula/arvo.rb manually or add HOMEBREW_TAP_TOKEN (Contents: Read & Write on robertguss/homebrew-tap)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update robertguss/homebrew-tap Formula/arvo.rb
        if: steps.check_token.outputs.enabled == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SRC_URL="https://github.com/robertguss/arvo/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL "$SRC_URL" -o src.tar.gz
          SRC_SHA=$(sha256sum src.tar.gz | awk '{print $1}')

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/robertguss/homebrew-tap.git" tap
          python3 - "$VERSION" "$TAG" "$SRC_SHA" <<'PY'
          import pathlib, sys

          version, tag, src_sha = sys.argv[1:4]
          template = """class Arvo < Formula
            desc "Calm, batteries-included Inertia v2 web framework for Mo with native Auth and SQLite/MoDB"
            homepage "https://github.com/robertguss/arvo"
            url "https://github.com/robertguss/arvo/archive/refs/tags/__TAG__.tar.gz"
            sha256 "__SRC_SHA__"
            version "__VERSION__"
            license "MIT"

            head "https://github.com/robertguss/arvo.git", branch: "main"

            depends_on "robertguss/tap/mo"
            depends_on "robertguss/tap/modb"

            def install
              libexec.install "mo.toml", "lib", "cmd", "packages", "bin"
              chmod 0755, libexec/"bin/arvo"

              inreplace libexec/"packages/arvo-modb/mo.toml",
                        'modb = { path = "../../../modb" }',
                        %(modb = { path = "#{Formula["modb"].opt_libexec}" })
              inreplace libexec/"packages/arvo-modb/cmd/backup/mo.toml",
                        'modb = { path = "../../../../../modb" }',
                        %(modb = { path = "#{Formula["modb"].opt_libexec}" })

              (bin/"arvo").write_env_script libexec/"bin/arvo",
                ARVO_ROOT: libexec,
                MO: Formula["mo"].opt_bin/"mo",
                MODB_PATH: Formula["modb"].opt_libexec

              doc.install "README.md", "LICENSE"
            end

            test do
              assert_match "Arvo Verification & Testing CLI", shell_output("#{bin}/arvo --help")
              system bin/"arvo", "new", "smoke-app", "--dir", testpath/"smoke-app"
              assert_match Formula["modb"].opt_libexec.to_s, (testpath/"smoke-app/mo.toml").read
              system Formula["mo"].opt_bin/"mo", "check", testpath/"smoke-app/main.mo"
            end
          end
          """
          rendered = (
              template
              .replace("__VERSION__", version)
              .replace("__TAG__", tag)
              .replace("__SRC_SHA__", src_sha)
          )
          pathlib.Path("tap/Formula/arvo.rb").write_text(rendered, encoding="utf-8")
          PY
          if command -v ruby >/dev/null 2>&1; then
            ruby -c tap/Formula/arvo.rb
          fi
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/arvo.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${VERSION}."
            exit 0
          fi
          git commit -m "arvo ${VERSION}"
          git push origin main
